<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-label="Felipe Ferreira, full-stack developer. A pipeline from spec to ship, with tests and CI as gates.">
  <text x="32" y="54" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" letter-spacing="-0.6">Felipe Ferreira dos Reis</text>

  <text x="32" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#8b949e">Full-stack developer. I build the product end to end and use agents</text>
  <text x="32" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#8b949e">inside the pipeline, not instead of it.</text>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e7681" letter-spacing="1.4">
    <text x="32" y="166">SPEC</text>
    <text x="232" y="166">CODE</text>
    <text x="432" y="166">TEST</text>
    <text x="632" y="166">CI</text>
    <text x="832" y="166">SHIP</text>
  </g>

  <line x1="32" y1="180" x2="888" y2="180" stroke="#30363d" stroke-width="1.5"/>

  <line x1="32" y1="180" x2="888" y2="180" stroke="#58a6ff" stroke-width="1.8"
        stroke-dasharray="856" stroke-dashoffset="856" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="856" to="0" dur="2.6s" begin="0.2s" fill="freeze"/>
  </line>

  <g>
    <circle cx="32" cy="180" r="4.5" fill="#30363d">
      <animate attributeName="fill" values="#30363d;#58a6ff" dur="0.3s" begin="0.2s" fill="freeze"/>
    </circle>
    <circle cx="232" cy="180" r="4.5" fill="#30363d">
      <animate attributeName="fill" values="#30363d;#e6edf3" dur="0.3s" begin="0.9s" fill="freeze"/>
    </circle>
    <circle cx="432" cy="180" r="4.5" fill="#30363d">
      <animate attributeName="fill" values="#30363d;#e6edf3" dur="0.3s" begin="1.4s" fill="freeze"/>
    </circle>
    <circle cx="632" cy="180" r="4.5" fill="#30363d">
      <animate attributeName="fill" values="#30363d;#e6edf3" dur="0.3s" begin="1.9s" fill="freeze"/>
    </circle>
    <circle cx="832" cy="180" r="4.5" fill="#30363d">
      <animate attributeName="fill" values="#30363d;#58a6ff" dur="0.3s" begin="2.4s" fill="freeze"/>
    </circle>
  </g>

  <circle cy="180" r="3.2" fill="#58a6ff">
    <animate attributeName="cx" values="32;832" dur="7s" begin="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.95;1" dur="7s" begin="3.2s" repeatCount="indefinite"/>
  </circle>

  <text x="32" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681">Agents help write the code. The gates decide what ships.</text>
</svg>
